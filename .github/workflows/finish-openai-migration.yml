name: Finish OpenAI migration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Migrate server and configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('server.ts')
          s = p.read_text()

          s = s.replace("import { GoogleGenAI } from '@google/genai';", "import OpenAI from 'openai';")

          a = s.find('let geminiClient:')
          b = s.find('function getBearerToken', a)
          if a >= 0 and b > a:
              s = s[:a] + s[b:]

          marker = "app.disable('x-powered-by');"
          if 'const openai = ' not in s:
              if marker not in s:
                  raise SystemExit('server marker not found')
              s = s.replace(marker, "const openai = process.env.OPENAI_API_KEY ? new OpenAI({ apiKey: process.env.OPENAI_API_KEY }) : null;\nconst OPENAI_MODEL = process.env.OPENAI_MODEL || 'gpt-5.6-luna';\nconst OPENAI_TTS_MODEL = process.env.OPENAI_TTS_MODEL || 'gpt-4o-mini-tts';\n\n" + marker, 1)

          s = s.replace("  const ai = getGemini();\n", "")
          s = s.replace("if (!ai || !process.env.GEMINI_API_KEY)", "if (!openai)")
          s = s.replace("requiresGeminiKey", "requiresOpenAiKey")
          s = s.replace("hasGeminiApiKey: Boolean(process.env.GEMINI_API_KEY)", "hasOpenAiApiKey: Boolean(process.env.OPENAI_API_KEY)")

          old = 'const response = await ai.models.generateContent({'
          replacement = """const response = await openai.chat.completions.create({
      model: OPENAI_MODEL,
      temperature: 0.2,
      response_format: { type: 'json_object' },
      messages: [
        { role: 'system', content: 'Return only valid JSON when structured output is requested. Be concise and practical.' },
        { role: 'user', content: prompt },
      ],
    });"""
          count = 0
          while old in s:
              start = s.index(old)
              depth = 0
              in_single = in_double = in_template = False
              escape = False
              i = s.index('{', start)
              j = i
              while j < len(s):
                  c = s[j]
                  if escape:
                      escape = False
                  elif c == '\\' and (in_single or in_double or in_template):
                      escape = True
                  elif c == "'" and not in_double and not in_template:
                      in_single = not in_single
                  elif c == '"' and not in_single and not in_template:
                      in_double = not in_double
                  elif c == '`' and not in_single and not in_double:
                      in_template = not in_template
                  elif not in_single and not in_double and not in_template:
                      if c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              j += 1
                              while j < len(s) and s[j].isspace(): j += 1
                              if s[j:j+2] != ');':
                                  raise SystemExit('Unexpected Gemini call terminator')
                              j += 2
                              break
                  j += 1
              s = s[:start] + replacement + s[j:]
              count += 1
          print('Gemini text calls replaced:', count)
          if count < 2:
              raise SystemExit('Expected both AI analysis and chat Gemini calls')

          s = s.replace("response.text || '{}'", "response.choices[0]?.message?.content || '{}'")

          start = s.find("app.post('/api/ai/tts'")
          end = s.find('async function startServer()', start)
          if start >= 0 and end > start:
              tts = """app.post('/api/ai/tts', async (req, res) => {
  const auth = await getAuthenticatedUser(req);
  if (!auth) return res.status(401).json({ error: 'Authentication required for AI voice.' });
  if (!openai) return res.status(503).json({ error: 'AI voice is unavailable because OpenAI is not configured.' });
  const text = typeof req.body?.text === 'string' ? req.body.text.trim() : '';
  const language = typeof req.body?.language === 'string' ? req.body.language : 'en';
  if (!text) return res.status(400).json({ error: 'Text is required.' });
  if (text.length > 4200) return res.status(413).json({ error: 'Voice text is too long.' });
  const languageName = LANGUAGE_NAMES[language] || 'English';
  try {
    const audio = await openai.audio.speech.create({
      model: OPENAI_TTS_MODEL,
      voice: 'alloy',
      input: text,
      response_format: 'wav',
      instructions: `Speak naturally, clearly and warmly in ${languageName}. Read only the supplied text.`,
    });
    res.setHeader('Content-Type', 'audio/wav');
    res.setHeader('Cache-Control', 'no-store');
    return res.send(Buffer.from(await audio.arrayBuffer()));
  } catch (err) {
    console.error('Error generating AI voice:', err);
    return res.status(502).json({ error: 'AI voice generation failed.' });
  }
});

"""
              s = s[:start] + tts + s[end:]

          p.write_text(s)

          pkg = Path('package.json')
          data = json.loads(pkg.read_text())
          data.get('dependencies', {}).pop('@google/genai', None)
          data.setdefault('dependencies', {})['openai'] = '^6.0.0'
          pkg.write_text(json.dumps(data, indent=2) + '\n')

          r = Path('render.yaml')
          if r.exists():
              r.write_text(r.read_text().replace('GEMINI_API_KEY', 'OPENAI_API_KEY'))
          PY

      - name: Refresh lockfile and verify
        run: |
          npm install --package-lock-only --ignore-scripts
          npm run lint
          npm run build
          if grep -R -n -E '@google/genai|GEMINI_API_KEY|GoogleGenAI|getGemini|gemini-2.5-flash|gemini-3.1-flash-tts-preview' server.ts package.json render.yaml; then
            echo 'Gemini references remain'; exit 1
          fi

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts package.json package-lock.json render.yaml
          git diff --cached --quiet && echo 'No changes to commit' && exit 0
          git commit -m "Switch NIRNAY AI from Gemini to OpenAI"
          git push

# Triggered migration uses the existing main branch so Render can auto-deploy the resulting commit.
