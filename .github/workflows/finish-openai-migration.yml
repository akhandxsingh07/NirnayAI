name: Finish OpenAI migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message != 'Switch NIRNAY AI from Gemini to OpenAI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Migrate server and configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          p = Path('server.ts')
          s = p.read_text()

          s = s.replace("import { GoogleGenAI } from '@google/genai';", "import OpenAI from 'openai';")
          s = s.replace("\nlet geminiClient: GoogleGenAI | null = null;\nfunction getGemini(): GoogleGenAI | null {\n  if (!geminiClient && process.env.GEMINI_API_KEY) {\n    geminiClient = new GoogleGenAI({ apiKey: process.env.GEMINI_API_KEY });\n  }\n  return geminiClient;\n}\n", "\n")

          marker = "});\n\napp.disable('x-powered-by');"
          openai_config = "});\n\nconst openai = process.env.OPENAI_API_KEY ? new OpenAI({ apiKey: process.env.OPENAI_API_KEY }) : null;\nconst OPENAI_MODEL = process.env.OPENAI_MODEL || 'gpt-5.6-luna';\nconst OPENAI_TTS_MODEL = process.env.OPENAI_TTS_MODEL || 'gpt-4o-mini-tts';\n\napp.disable('x-powered-by');"
          if "const openai = process.env.OPENAI_API_KEY" not in s:
              if marker not in s:
                  raise SystemExit('Supabase auth marker not found')
              s = s.replace(marker, openai_config, 1)

          s = re.sub(r"function pcmToWav\([\s\S]*?\n}\n\n(?=app\.get\('/api/health')", "", s, count=1)
          s = s.replace("hasGeminiApiKey: Boolean(process.env.GEMINI_API_KEY),", "hasOpenAiApiKey: Boolean(process.env.OPENAI_API_KEY),")
          s = s.replace("  const ai = getGemini();\n\n", "")
          s = s.replace("if (!ai || !process.env.GEMINI_API_KEY)", "if (!openai)")
          s = s.replace("requiresGeminiKey", "requiresOpenAiKey")
          s = s.replace("Gemini returned an empty chat answer.", "OpenAI returned an empty chat answer.")
          s = s.replace("response.text || '{}'", "response.choices[0]?.message?.content || '{}'")

          gemini_call = re.compile(r"const response = await ai\.models\.generateContent\(\{[\s\S]*?\n\s*\}\);", re.MULTILINE)
          openai_call = """const response = await openai.chat.completions.create({
      model: OPENAI_MODEL,
      temperature: 0.2,
      response_format: { type: 'json_object' },
      messages: [
        { role: 'system', content: 'Return only valid JSON. Do not wrap it in markdown.' },
        { role: 'user', content: prompt },
      ],
    });"""
          s, calls_changed = gemini_call.subn(openai_call, s)
          if calls_changed != 2:
              raise SystemExit(f'Expected 2 Gemini text calls, changed {calls_changed}')

          start = s.find("app.post('/api/ai/tts'")
          end = s.find('async function startServer()', start)
          if start < 0 or end < 0:
              raise SystemExit('TTS block not found')
          tts = """app.post('/api/ai/tts', async (req, res) => {
  const auth = await getAuthenticatedUser(req);
  if (!auth) return res.status(401).json({ error: 'Authentication required for AI voice.' });
  if (!openai) return res.status(503).json({ error: 'AI voice is unavailable because OpenAI is not configured.' });

  const text = typeof req.body?.text === 'string' ? req.body.text.trim() : '';
  const language = typeof req.body?.language === 'string' ? req.body.language : 'en';
  if (!text) return res.status(400).json({ error: 'Text is required.' });
  if (text.length > 4200) return res.status(413).json({ error: 'Voice text is too long.' });

  const languageName = LANGUAGE_NAMES[language] || 'English';
  const languageCode = TTS_LANGUAGE_CODES[language];

  try {
    const instructions = `Speak naturally, clearly and warmly in ${languageName}. Read only the supplied text. Do not add commentary, summarize, or translate it into English. Preserve the selected language, numbers and rupee amounts.${languageCode ? ` Use Indian ${languageName} pronunciation where natural.` : ''}`;
    const audio = await openai.audio.speech.create({
      model: OPENAI_TTS_MODEL,
      voice: 'alloy',
      input: text,
      response_format: 'wav',
      instructions,
    });
    const audioBuffer = Buffer.from(await audio.arrayBuffer());
    res.setHeader('Content-Type', 'audio/wav');
    res.setHeader('Cache-Control', 'no-store');
    res.setHeader('X-Nirnay-Voice-Engine', OPENAI_TTS_MODEL);
    return res.send(audioBuffer);
  } catch (err) {
    console.error('Error generating multilingual AI voice:', err);
    return res.status(502).json({ error: 'AI voice generation failed.' });
  }
});

"""
          s = s[:start] + tts + s[end:]
          p.write_text(s)

          pkg = Path('package.json')
          data = json.loads(pkg.read_text())
          data.get('dependencies', {}).pop('@google/genai', None)
          data['dependencies']['openai'] = '^6.0.0'
          pkg.write_text(json.dumps(data, indent=2) + '\n')

          r = Path('render.yaml')
          rs = r.read_text().replace('GEMINI_API_KEY', 'OPENAI_API_KEY')
          r.write_text(rs)
          PY
      - name: Refresh lockfile and verify build
        run: |
          npm install --package-lock-only --ignore-scripts
          npm run lint
          npm run build
          ! grep -R "@google/genai\|GEMINI_API_KEY\|GoogleGenAI\|getGemini\|gemini-2.5-flash\|gemini-3.1-flash-tts-preview" server.ts package.json render.yaml
      - name: Remove one-time workflow
        run: rm -f .github/workflows/finish-openai-migration.yml
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts package.json package-lock.json render.yaml .github/workflows/finish-openai-migration.yml
          git commit -m "Switch NIRNAY AI from Gemini to OpenAI"
          git push
