name: Final AI stack fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/direct-openai-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix backend and frontend AI fallbacks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          server = Path('server.ts')
          s = server.read_text()
          s = s.replace("const aiRateLimit = createRateLimiter(60_000, 24);", "const aiRateLimit = createRateLimiter(60_000, 60);")
          s = re.sub(r"app\.get\('/api/health', \(_req, res\) => \{.*?\n\}\);", "app.get('/api/health', (_req, res) => {\n  res.json({ status: 'ok', service: 'NIRNAY AI Server', backend: 'Express' });\n});", s, count=1, flags=re.S)
          s = re.sub(r"app\.post\('/api/ai/analyze', async \(req, res\) => \{\n\s*const auth = await getAuthenticatedUser\(req\);\n\s*if \(!auth\) return res\.json\(\{ demoMode: true, isAiGenerated: false, requiresAuth: true \}\);", "app.post('/api/ai/analyze', async (req, res) => {", s, count=1)
          server.write_text(s)

          chat = Path('src/services/chatService.ts')
          c = chat.read_text()
          start = c.find('export async function askNirnayQuestion(')
          if start < 0:
              raise SystemExit('chat function not found')
          new_fn = r'''export async function askNirnayQuestion(
  question: string,
  context: ChatContext,
  history: ChatHistoryMessage[] = []
): Promise<ChatResponse> {
  const { data } = await supabase.auth.getSession();
  const token = data.session?.access_token;
  const res = await fetch('/api/ai/chat', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
    },
    body: JSON.stringify({ question, context, history: history.slice(-10) }),
  });

  let payload: any = null;
  try { payload = await res.json(); } catch { payload = null; }
  if (!res.ok || !payload?.answer) {
    const message = typeof payload?.error === 'string' ? payload.error : `AI request failed (HTTP ${res.status}).`;
    throw new Error(message);
  }
  return {
    answer: payload.answer,
    sources: payload.sources,
    followUps: payload.followUps,
    confidenceNote: payload.confidenceNote,
  };
}
'''
          c = c[:start] + new_fn
          chat.write_text(c)
          PY

          npm run lint
          npm run build
          if grep -R -nE 'GoogleGenAI|getGemini|GEMINI_API_KEY|gemini-2.5-flash|@google/genai' server.ts package.json src/services/chatService.ts; then exit 1; fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts src/services/chatService.ts
          git diff --cached --quiet || git commit -m 'fix: finalize AI chatbot stack'
          git push
