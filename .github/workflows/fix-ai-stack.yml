name: Fix AI chatbot stack

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'fix: finalize AI chatbot stack')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch AI stack
        run: |
          node <<'NODE'
          const fs = require('fs');

          const serverPath = 'server.ts';
          let server = fs.readFileSync(serverPath, 'utf8');

          server = server.replace(
            "const OPENAI_MODEL = process.env.OPENAI_MODEL || 'gpt-5.6-luna';",
            "const OPENAI_MODEL = process.env.OPENAI_MODEL || 'gpt-5.6-luna';"
          );

          server = server.replace(
            "const aiRateLimit = createRateLimiter(60_000, 24);",
            "const aiRateLimit = createRateLimiter(60_000, 60);"
          );

          server = server.replace(
            /app\.get\('\/api\/health', \(_req, res\) => \{[\s\S]*?\n\}\);/,
            `app.get('/api/health', (_req, res) => {\n  res.json({ status: 'ok', service: 'NIRNAY AI Server', backend: 'Express' });\n});`
          );

          server = server.replace(
            /app\.post\('\/api\/ai\/analyze', async \(req, res\) => \{\n\s*const auth = await getAuthenticatedUser\(req\);\n\s*if \(!auth\) return res\.json\(\{ demoMode: true, isAiGenerated: false, requiresAuth: true \}\);\n\s*if \(!openai\)/,
            "app.post('/api/ai/analyze', async (req, res) => {\n  if (!openai)"
          );

          if (!server.includes("const OPENAI_MODEL = process.env.OPENAI_MODEL || 'gpt-5.6-luna';")) {
            throw new Error('OpenAI model configuration was not found');
          }
          if (server.includes('demoMode: true, isAiGenerated: false, requiresAuth: true')) {
            throw new Error('Analysis authentication gate was not removed');
          }
          if (server.includes('hasOpenAiApiKey: Boolean(process.env.OPENAI_API_KEY)')) {
            throw new Error('Health endpoint still exposes configuration state');
          }

          fs.writeFileSync(serverPath, server);

          const chatPath = 'src/services/chatService.ts';
          let chat = fs.readFileSync(chatPath, 'utf8');
          const oldChat = `export async function askNirnayQuestion(\n  question: string,\n  context: ChatContext,\n  history: ChatHistoryMessage[] = []\n): Promise<ChatResponse> {\n  let fallbackReason: 'auth' | 'key' | 'unavailable' = 'unavailable';\n  try {\n    const { data } = await supabase.auth.getSession();\n    const token = data.session?.access_token;\n    const res = await fetch('/api/ai/chat', {\n      method: 'POST',\n      headers: {\n        'Content-Type': 'application/json',\n        ...(token ? { Authorization: \`Bearer \${token}\` } : {}),\n      },\n      body: JSON.stringify({ question, context, history: history.slice(-10) }),\n    });\n\n    if (res.ok) {\n      const payload = await res.json();\n      if (payload?.answer) {\n        return {\n          answer: payload.answer,\n          sources: payload.sources,\n          followUps: payload.followUps,\n          confidenceNote: payload.confidenceNote,\n        };\n      }\n      if (payload?.requiresAuth) fallbackReason = 'auth';\n      if (payload?.requiresGeminiKey) fallbackReason = 'key';\n    }\n  } catch {\n    fallbackReason = 'unavailable';\n  }\n\n  const language = normalizeLanguage(context.language);\n  return buildLocalFallback(question, context, language, fallbackReason);\n}`;

          const newChat = `export async function askNirnayQuestion(\n  question: string,\n  context: ChatContext,\n  history: ChatHistoryMessage[] = []\n): Promise<ChatResponse> {\n  const { data } = await supabase.auth.getSession();\n  const token = data.session?.access_token;\n  const res = await fetch('/api/ai/chat', {\n    method: 'POST',\n    headers: {\n      'Content-Type': 'application/json',\n      ...(token ? { Authorization: \`Bearer \${token}\` } : {}),\n    },\n    body: JSON.stringify({ question, context, history: history.slice(-10) }),\n  });\n\n  let payload: any = null;\n  try {\n    payload = await res.json();\n  } catch {\n    payload = null;\n  }\n\n  if (!res.ok || !payload?.answer) {\n    const message = typeof payload?.error === 'string' ? payload.error : \`AI request failed (HTTP \${res.status}).\`;\n    throw new Error(message);\n  }\n\n  return {\n    answer: payload.answer,\n    sources: payload.sources,\n    followUps: payload.followUps,\n    confidenceNote: payload.confidenceNote,\n  };\n}`;

          if (!chat.includes(oldChat)) {
            throw new Error('Chat service target block was not found; refusing an unsafe partial edit');
          }
          chat = chat.replace(oldChat, newChat);
          fs.writeFileSync(chatPath, chat);
          NODE
      - name: Verify
        run: npm run lint && npm run build
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/services/chatService.ts
          git diff --cached --quiet || git commit -m "fix: finalize AI chatbot stack"
          git push
