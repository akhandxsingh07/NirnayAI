name: Fix AI chatbot stack

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'fix: finalize AI chatbot stack')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch AI stack
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('server.ts')
          s = p.read_text()
          s = s.replace("const aiRateLimit = createRateLimiter(60_000, 24);", "const aiRateLimit = createRateLimiter(60_000, 60);")
          s = re.sub(r"app\.get\('/api/health', \(_req, res\) => \{.*?\n\}\);", "app.get('/api/health', (_req, res) => {\n  res.json({ status: 'ok', service: 'NIRNAY AI Server', backend: 'Express' });\n});", s, count=1, flags=re.S)
          s = re.sub(r"app\.post\('/api/ai/analyze', async \(req, res\) => \{\n\s*const auth = await getAuthenticatedUser\(req\);\n\s*if \(!auth\) return res\.json\(\{ demoMode: true, isAiGenerated: false, requiresAuth: true \}\);", "app.post('/api/ai/analyze', async (req, res) => {", s, count=1)
          if "const OPENAI_MODEL = process.env.OPENAI_MODEL || 'gpt-5.6-luna';" not in s:
              raise SystemExit('OpenAI model configuration missing')
          if 'hasOpenAiApiKey: Boolean(process.env.OPENAI_API_KEY)' in s:
              raise SystemExit('health endpoint still exposes configuration state')
          p.write_text(s)

          p = Path('src/services/chatService.ts')
          s = p.read_text()
          start = s.find('export async function askNirnayQuestion(')
          if start < 0: raise SystemExit('chat function not found')
          fn = r'''export async function askNirnayQuestion(
  question: string,
  context: ChatContext,
  history: ChatHistoryMessage[] = []
): Promise<ChatResponse> {
  const { data } = await supabase.auth.getSession();
  const token = data.session?.access_token;
  const res = await fetch('/api/ai/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
    body: JSON.stringify({ question, context, history: history.slice(-10) }),
  });
  let payload: any = null;
  try { payload = await res.json(); } catch { payload = null; }
  if (!res.ok || !payload?.answer) {
    throw new Error(typeof payload?.error === 'string' ? payload.error : `AI request failed (HTTP ${res.status}).`);
  }
  return { answer: payload.answer, sources: payload.sources, followUps: payload.followUps, confidenceNote: payload.confidenceNote };
}
'''
          p.write_text(s[:start] + fn)
          PY
      - name: Install and verify
        run: npm install --ignore-scripts && npm run lint && npm run build
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/services/chatService.ts package-lock.json
          git diff --cached --quiet || git commit -m "fix: finalize AI chatbot stack"
          git push
