name: Harden AI Stack

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, 'fix: harden AI chatbot and remove local fallback') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch AI backend and frontend fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('server.ts')
          s = p.read_text()
          s = s.replace("const aiRateLimit = createRateLimiter(60_000, 24);", "const aiRateLimit = createRateLimiter(60_000, 60);")
          s = re.sub(
              r"app\.get\('/api/health', \(_req, res\) => \{.*?\n\}\);",
              """app.get('/api/health', (_req, res) => {
            res.json({ status: 'ok', service: 'NIRNAY AI Server' });
          });""",
              s, count=1, flags=re.S
          )
          s = s.replace(
              "  const auth = await getAuthenticatedUser(req);\n  if (!auth) return res.json({ demoMode: true, isAiGenerated: false, requiresAuth: true });\n  if (!openai) return res.status(503).json({ error: 'OpenAI is not configured on the server.' });",
              "  if (!openai) return res.status(503).json({ error: 'OpenAI is not configured on the server.' });",
              1
          )
          p.write_text(s)

          p = Path('src/services/aiService.ts')
          s = p.read_text()
          marker = 'export async function askAssistantQuestion('
          start = s.find(marker)
          if start == -1:
              raise SystemExit('askAssistantQuestion not found')
          replacement = r'''export async function askAssistantQuestion(
  question: string,
  context: {
    businessIdea?: string;
    category?: string;
    district?: string;
    state?: string;
    skill?: string;
    experience?: string;
    margin?: number;
    projectCost?: number;
    loan?: number;
    scheme?: string;
    language?: string;
  }
): Promise<{ answer: string; followUps?: string[]; confidenceNote?: string; sources?: string[] }> {
  const authHeaders = await getAuthHeaders();
  const res = await fetch('/api/ai/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...authHeaders },
    body: JSON.stringify({ question, context }),
  });

  let data: any = null;
  try { data = await res.json(); } catch { /* handled below */ }
  if (!res.ok) {
    throw new Error(data?.error || `AI chat failed (${res.status}).`);
  }
  if (!data?.answer) throw new Error('AI chat returned an empty response.');
  return data;
}
'''
          p.write_text(s[:start] + replacement)
          PY

      - name: Type-check and build
        run: |
          npm install --no-audit --no-fund
          npm run deploy:check

      - name: Commit hardened AI stack
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/services/aiService.ts
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "fix: harden AI chatbot and remove local fallback"
            git push
          fi
